name: Publish Docker Images

# Publishes to GitHub Container Registry on any tag push.
# Upstream also pushed to Docker Hub under jmtvms/tplink-omada-mcp; that job
# was removed here because it targets someone else's namespace and would fail
# on this fork regardless. ghcr needs no secrets beyond GITHUB_TOKEN.

on:
  push:
    tags:
      - "*"
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-ghcr:
    name: Build and Push to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      ghcr-image: ${{ steps.meta.outputs.ghcr-image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image metadata
        id: meta
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          owner_lower=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ref="${GITHUB_REF}"

          if [[ "${ref}" == refs/tags/* ]]; then
            ref_name="${ref#refs/tags/}"
            image_tag="${ref_name}"
            tags=$(printf "%s\n%s" \
              "${REGISTRY}/${owner_lower}/tplink-omada-mcp:latest" \
              "${REGISTRY}/${owner_lower}/tplink-omada-mcp:${ref_name}")
          else
            ref_name="${GITHUB_HEAD_REF:-${ref#refs/heads/}}"
            sanitized=$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            image_tag="${sanitized}"
            tags="${REGISTRY}/${owner_lower}/tplink-omada-mcp:${sanitized}"
          fi

          ghcr_image="${REGISTRY}/${owner_lower}/tplink-omada-mcp:${image_tag}"

          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "ghcr-image=${ghcr_image}" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scans the image we just pushed, including OS packages from the
  # node:24-bookworm-slim base layer - which npm audit cannot see at all.
  #
  # Deliberately non-blocking: by the time this runs the image is already in
  # ghcr, so failing here would report a problem it cannot prevent. The value
  # is the SARIF upload, which puts findings in the repo Security tab where
  # they persist and can be triaged. The blocking gate lives in security.yml,
  # on pull requests, where blocking still changes the outcome.
  scan-image:
    name: Scan Published Image
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-and-push-ghcr.outputs.ghcr-image }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # Only report what can actually be acted on. An unfixed base-image
          # CVE is the base image maintainer's queue, not ours.
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
